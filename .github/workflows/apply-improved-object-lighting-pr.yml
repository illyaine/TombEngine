name: Apply improved object lighting patch from PR

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.head_ref == 'feature/improved-object-lighting-selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > .github/object-lighting-patch-error.log 2>&1
          from pathlib import Path

          workflow = Path('.github/workflows/apply-improved-object-lighting.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit source changes"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          source = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source.splitlines())
          exec(compile(script, '<object-lighting-patch>', 'exec'))
          PY
          status=$?
          if [ $status -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/object-lighting-patch-error.log
            git commit -m "Update object lighting patch diagnostics"
            git push origin HEAD:${{ github.head_ref }}
            exit $status
          fi
          rm -f .github/object-lighting-patch-error.log

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A TombEngine/Renderer/Renderer.h TombEngine/Renderer/RendererFrame.cpp TombEngine/Specific/Input/Input.cpp .github/object-lighting-patch-error.log
          git commit -m "Improve static and moveable light selection"
          git push origin HEAD:${{ github.head_ref }}
