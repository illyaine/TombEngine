name: Apply GPU starfield branch

on:
  push:
    branches:
      - performance/gpu-starfield-bootstrap
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'performance/gpu-starfield-bootstrap' || github.ref_name == 'performance/gpu-starfield-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: performance/gpu-starfield-bootstrap
          show-progress: false

      - name: Prepare generator
        shell: bash
        run: |
          cp tools/apply_gpu_starfield.py /tmp/apply_gpu_starfield.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_gpu_starfield.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path.cwd()', 1)

          old_validation = '''    if "GetWorldMatrixForSprite(rDrawSprite, renderView)" in renderer_draw[renderer_draw.index("void Renderer::DrawHorizonAndSky"):]:\n        raise RuntimeError("CPU star world-matrix generation still exists")\n'''
          if old_validation not in text:
              raise SystemExit('Expected temporary validation block was not found')
          text = text.replace(old_validation, '', 1)

          filters_block = '''    filters = "TombEngine/TombEngine.vcxproj.filters"\n    clone_filter_entry(filters, "Renderer\\\\RendererSprites.cpp", "Renderer\\\\RendererStarfield.cpp")\n    clone_filter_entry(filters, "Renderer\\\\ConstantBuffers\\\\SkyBuffer.h", "Renderer\\\\ConstantBuffers\\\\StarfieldBuffer.h")\n    clone_filter_entry(filters, "Shaders\\\\Sky.hlsl", "Shaders\\\\Starfield.hlsl")\n    clone_filter_entry(filters, "Shaders\\\\CBSky.hlsli", "Shaders\\\\CBStarfield.hlsli")\n\n'''
          if filters_block not in text:
              raise SystemExit('Expected Visual Studio filters block was not found')
          text = text.replace(filters_block, '', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Generate clean feature branch
        id: generate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            git fetch --quiet --depth=1 origin master
            git checkout -B performance/gpu-starfield origin/master
            python /tmp/apply_gpu_starfield.py

            python - <<'PY'
          from pathlib import Path
          import re

          path = Path('TombEngine/TombEngine.vcxproj')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    <None Include="Shaders\\Starfield.hlsl" />\n', '', 1)
          text = text.replace('    <None Include="Shaders\\CBStarfield.hlsli" />\n', '', 1)

          def clone_none_block(source: str, target: str) -> None:
              global text
              pattern = rf'(?ms)^    <None Include="{re.escape(source)}">.*?^    </None>'
              match = re.search(pattern, text)
              if not match:
                  raise RuntimeError(f'Could not locate project block for {source}')
              block = match.group(0).replace(source, target, 1)
              text = text[:match.end()] + '\n' + block + text[match.end():]

          clone_none_block('Shaders\\CBSky.hlsli', 'Shaders\\CBStarfield.hlsli')
          clone_none_block('Shaders\\Sky.hlsl', 'Shaders\\Starfield.hlsl')

          normalized = text.replace('\r\n', '\n').replace('\r', '\n')
          path.write_bytes(normalized.replace('\n', '\r\n').encode('utf-8'))
          PY

            git diff --check

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add TombEngine
            git commit -m "Move starfield simulation and rendering to the GPU"
            git push --force origin HEAD:performance/gpu-starfield
          } > /tmp/gpu-starfield-generator.log 2>&1
          status=$?
          cat /tmp/gpu-starfield-generator.log
          exit "$status"

      - name: Upload generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-starfield-generator-log
          path: /tmp/gpu-starfield-generator.log
          if-no-files-found: warn

      - name: Fail when generation failed
        if: steps.generate.outcome == 'failure'
        run: exit 1
