name: Fix object lighting indentation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix-source:
    if: github.head_ref == 'feature/improved-object-lighting-selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Replace escaped indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('TombEngine/Renderer/RendererFrame.cpp')
          text = path.read_text(encoding='utf-8')

          def fix_segment(text, start_marker, end_marker):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              segment = text[start:end].replace('\\t', '\t')
              return text[:start] + segment + text[end:]

          text = fix_segment(
              text,
              r'\tvoid Renderer::CollectLights(',
              '\tvoid Renderer::CollectLightsForCamera()')
          text = fix_segment(
              text,
              r'\tvoid Renderer::CollectLightsForItem(',
              '\tvoid Renderer::CalculateLightFades(')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit corrected source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TombEngine/Renderer/RendererFrame.cpp
          git commit -m "Fix object lighting source indentation"
          git push origin HEAD:${{ github.head_ref }}
